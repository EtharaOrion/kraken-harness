# Configuration defaults of the Kraken benchmark. A run may narrow the lanes and change the
# rollout count on the command line; the Harbor pin must agree with the parent's harbor.lock.

[benchmark]
name = "kraken"
description = "Harbor-format performance-optimization tasks resident in the Kraken parent, scored by each bundle's own tests."

[harbor]
release = "0.25.0"
commit = "fdba28fc411e47e8765420a1a063b4918fce3def"

[lanes]
resident = ["samples", "delivery"]

[inference]
# The client's quality bar measures four rollouts per task.
rollouts = 4
