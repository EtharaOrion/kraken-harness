# LLM proxy config for `repo2rlenv generate --config`.
# Copy to llm-proxy.yaml and fill in the values proxy_check.sh prints.
#
# The `endpoint` becomes litellm's api_base; `api_key_env` names the env var
# holding the proxy token (export it before running). repo/ref/pipeline options
# are still passed as CLI flags by generate_slice.sh and merge over this file.
llm:
  provider: anthropic          # "anthropic" (/v1/messages) or "openai" (/v1/chat/completions)
  model: claude-sonnet-4-5     # exact model string the proxy accepts
  endpoint: http://localhost:3456   # for openai-style use .../v1
  api_key_env: PROXY_API_KEY   # export PROXY_API_KEY=<token> (any non-empty value for a no-auth bridge)
  timeout_sec: 300
