- id: SEC-001
  title: "GitHub Personal Access Token exposed in git history"
  severity: CRITICAL
  category: security
  tool: gitleaks
  rule_id: github-pat
  description: >-
    A GitHub Personal Access Token was detected in .env.bak, committed to git
    history. gitleaks --log-opts=--all found this in the full history scan.
    Secret exposure is a CRITICAL-floor item and cannot be waived to SHIP.
    The token may grant unauthorized repository access and must be rotated
    immediately. The .env.bak file must be purged from history via
    git-filter-repo or BFG.
  evidence: "gitleaks/github-pat at .env.bak (cluster_fingerprint: 178bef5355db8b41)"
  recommendation: >-
    1. Rotate the GitHub PAT immediately.
    2. Remove .env.bak from git history using git-filter-repo.
    3. Force-push the cleaned history.
    4. Audit all actions taken with the token.
  disposition: BLOCK
  affected_files:
    - ".env.bak"
  issue_count: 1
  source_tools:
    - gitleaks

